# Run using:
#   docker compose up --build

services:
  filebrowser:
    container_name: filebrowser
    build:
      dockerfile: Dockerfile
      context: .
    networks:
      - filebrowser
    ports:
      - 8000:80
    volumes:
      - filebrowser:/flux/vault
    environment:
      - REDIS_CACHE_URL=redis://default:filebrowser@redis:6379 # Use rediss:// for ssl
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
    depends_on:
      clamav:
        condition: service_healthy

  redis:
    container_name: redis
    image: redis:latest
    networks:
      - filebrowser
    command:
      - sh
      - -c
      - |
        cat > /tmp/users.acl <<EOF
        user default on >filebrowser ~* +@all
        EOF
        redis-server --aclfile /tmp/users.acl

  clamav:
    container_name: clamav
    image: clamav/clamav:latest
    networks:
      - filebrowser
    volumes:
      - clamav-signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    environment:
      - CLAMAV_NO_FRESHCLAM=false

networks:
  filebrowser:

volumes:
  filebrowser:
  clamav-signatures:
